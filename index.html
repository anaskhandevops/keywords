<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Keyword Trigger & Display</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Optional: You can customize Tailwind theme here if needed
        tailwind.config = {
          theme: {
            extend: {
              fontFamily: {
                sans: ['Inter', 'sans-serif'], // Use Inter font
              },
            }
          }
        }
    </script>
    <style>
        /* Add custom styles if needed, but prefer Tailwind classes */
        body {
            font-family: 'Inter', sans-serif; /* Apply Inter font */
        }
        /* Style for the story display area */
        #storyOutput {
            white-space: pre-wrap; /* Preserve whitespace and line breaks from the story */
            text-align: left;
            background-color: #f9f9f9;
            border: 1px solid #eee;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            min-height: 50px; /* Reserve some space */
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h1 class="text-2xl font-semibold mb-6 text-gray-700 text-center">Enter Your Story Keyword</h1>

        <form id="storyForm" class="space-y-4">
            <div>
                <label for="storyKeyword" class="block text-sm font-medium text-gray-600 mb-1 text-left">Keyword:</label>
                <input
                    type="text"
                    id="storyKeyword"
                    name="storyKeyword"
                    placeholder="e.g., dragon, space, mystery"
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out"
                >
            </div>

            <button
                type="submit"
                id="submitButton"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150 ease-in-out disabled:opacity-50 disabled:cursor-not-allowed"
            >
                Generate Story
            </button>
        </form>

        <p id="statusMessage" class="mt-4 text-sm min-h-[1.2em] text-center"></p>

        <div id="storyOutput" class="hidden">
             </div>

    </div>

    <script>
        // --- ZAPIER WEBHOOK URL ---
        const ZAPIER_WEBHOOK_URL = 'https://hooks.zapier.com/hooks/catch/22738539/2pqq1ux/';
        // --- --- --- --- --- --- ---

        // Get references to HTML elements
        const storyForm = document.getElementById('storyForm');
        const keywordInput = document.getElementById('storyKeyword');
        const statusMessage = document.getElementById('statusMessage');
        const submitButton = document.getElementById('submitButton');
        const storyOutputDiv = document.getElementById('storyOutput'); // Get the story display div

        /**
         * Displays a status message to the user.
         * @param {string} message - The text message to display.
         * @param {'success' | 'error' | 'info'} type - The type of message (for styling).
         */
        function displayStatusMessage(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = 'mt-4 text-sm min-h-[1.2em] text-center '; // Reset classes
            switch (type) {
                case 'success':
                    statusMessage.classList.add('text-green-600');
                    break;
                case 'error':
                    statusMessage.classList.add('text-red-600');
                    break;
                case 'info':
                default:
                    statusMessage.classList.add('text-gray-600');
                    break;
            }
        }

        // Add event listener for form submission
        storyForm.addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent page reload
            const keyword = keywordInput.value.trim();

            if (!keyword) {
                displayStatusMessage('Please enter a keyword.', 'error');
                return;
            }

            // Basic check for placeholder URL
            if (!ZAPIER_WEBHOOK_URL || ZAPIER_WEBHOOK_URL === 'YOUR_ZAPIER_WEBHOOK_URL_HERE') {
                console.error("Zapier Webhook URL is not configured!");
                displayStatusMessage('Configuration error: Webhook URL not set.', 'error');
                return;
            }

            // Prepare data to send
            const dataToSend = {
                story_keyword: keyword,
                submitted_at: new Date().toISOString()
            };

            // --- Update UI for loading state ---
            displayStatusMessage('Generating story with Zapier & Gemini... Please wait.', 'info');
            submitButton.disabled = true;
            storyOutputDiv.classList.add('hidden'); // Hide previous story output
            storyOutputDiv.textContent = ''; // Clear previous story text

            // --- Send data using Fetch API ---
            fetch(ZAPIER_WEBHOOK_URL, {
                method: 'POST',
                // *** REMOVED Content-Type HEADER TO AVOID CORS PREFLIGHT ISSUE ***
                // headers: {
                //    'Content-Type': 'application/json',
                // },
                body: JSON.stringify(dataToSend) // Zapier should still parse this JSON body
            })
            .then(response => {
                // Check if the response status code indicates success (e.g., 200 OK)
                if (response.ok) {
                    // If successful, parse the JSON response FROM ZAPIER (expecting the story)
                    return response.json();
                } else {
                    // If the response status indicates an error (e.g., Zap error, timeout)
                    // Try to get text for better error message
                    return response.text().then(text => {
                         throw new Error(`Zapier response error: ${response.status} ${response.statusText}. ${text}`);
                    });
                }
            })
            .then(data => {
                // --- Handle the successful response containing the story ---
                console.log('Zapier response data:', data);

                // Check if the expected 'story' field exists in the response data
                if (data && data.story) {
                    storyOutputDiv.textContent = data.story; // Display the story
                    storyOutputDiv.classList.remove('hidden'); // Make the div visible
                    displayStatusMessage('Story generated successfully!', 'success');
                    keywordInput.value = ''; // Clear input field
                } else {
                    // Handle cases where the response format is unexpected
                    console.error('Unexpected response format from Zapier:', data);
                    throw new Error('Received response from Zapier, but story data was missing.');
                }
            })
            .catch(error => {
                // --- Handle errors during fetch or response processing ---
                console.error('Error during story generation:', error);
                // Display the actual error message from the fetch failure (will likely show CORS error if this fix doesn't work)
                displayStatusMessage(`Error: ${error.message}`, 'error');
                storyOutputDiv.classList.add('hidden'); // Ensure story div is hidden on error
            })
            .finally(() => {
                // --- Re-enable button regardless of success/failure ---
                submitButton.disabled = false;
            });
        });

    </script>

</body>
</html>
```
